
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nossa Galáxia Particular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
      }
      .font-romantic {
        font-family: 'Dancing Script', cursive;
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #error-display {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #fff0f5; color: #d63384;
        padding: 40px; z-index: 9999;
        font-family: 'Inter', sans-serif;
        overflow: auto;
      }
      #error-display h1 { font-family: 'Dancing Script', cursive; font-size: 2.5rem; margin-bottom: 20px; }
      #error-display code { background: #ffe4e1; padding: 2px 5px; border-radius: 4px; color: #b01a5f; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <script>
      // Capturador de erros aprimorado
      window.onerror = function(msg, url, line, col, error) {
        var display = document.getElementById('error-display');
        if (display) {
          display.style.display = 'block';
          display.innerHTML += '<div style="margin-bottom: 15px; border-bottom: 1px dashed #d63384; padding-bottom: 10px;">' +
            '<strong>Erro detectado:</strong><br>' +
            '<code>' + msg + '</code><br>' +
            '<small>Arquivo: ' + url + ' (Linha: ' + line + ')</small>' +
            '</div>';
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        console.error('Rejeição não tratada:', event.reason);
      };
    </script>
  </head>
  <body class="bg-rose-50 overflow-x-hidden">
    <div id="root"></div>
    
    <!-- Este painel só aparece se o site travar -->
    <div id="error-display">
      <h1>Ops! Ocorreu um problema...</h1>
      <p>O site não conseguiu carregar completamente no seu navegador. Isso geralmente acontece por um erro de conexão ou incompatibilidade de módulos.</p>
      <hr style="border: none; border-top: 1px solid #ffc0cb; margin: 20px 0;">
    </div>

    <script type="module" src="index.tsx"></script>
  </body>
</html>
