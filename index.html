
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nossa Galáxia Particular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-romantic {
        font-family: 'Dancing Script', cursive;
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #error-display {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #fff0f5; color: #d63384;
        padding: 20px; z-index: 9999;
        font-family: monospace; overflow: auto;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
    <script>
      // Capturador de erros global para ajudar a identificar por que a tela fica branca no GitHub
      window.onerror = function(msg, url, line, col, error) {
        var display = document.getElementById('error-display');
        if (display) {
          display.style.display = 'block';
          display.innerHTML += '<p>Erro: ' + msg + '<br>Onde: ' + url + ' L:' + line + '</p>';
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        var display = document.getElementById('error-display');
        if (display) {
          display.style.display = 'block';
          display.innerHTML += '<p>Erro na Promise: ' + event.reason + '</p>';
        }
      };
    </script>
  </head>
  <body class="bg-rose-50 overflow-x-hidden">
    <div id="root"></div>
    <div id="error-display"><h1>Ops! Algo deu errado ao carregar:</h1></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
